# LiteLLM proxy configuration. One public model name ("autonoms") that the app asks for;
# the gateway decides which real model serves it.
model_list:
  - model_name: autonoms                      # what Autonoms asks for
    litellm_params:
      model: ollama_chat/qwen3.5:9b-8k        # what actually answers
      api_base: http://127.0.0.1:11434        # the container shares the host's network (see run.sh)
      rpm: 20                                 # rate limit, enforced because of routing_strategy below
                                              # (measured: a limit of N lets N-1 requests per minute through)
  - model_name: autonoms-backup               # used only if the first one fails
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://127.0.0.1:11434
      rpm: 20                                 # without its own limit, overflow would just move here

router_settings:
  routing_strategy: usage-based-routing-v2    # counts requests per model; plain rpm values are only hints
  num_retries: 1
  timeout: 600                                # a 9B model on this laptop is slow
  fallbacks: [{ "autonoms": ["autonoms-backup"] }]

litellm_settings:
  drop_params: true                           # ignore request fields the Ollama backend doesn't know

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # callers must send this key
