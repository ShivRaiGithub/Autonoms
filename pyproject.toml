[project]
name = "autonoms"
version = "0.1.0"
description = "Autonomous GitHub issue resolution agent (learning project)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "llama-index-core>=0.12",
    "llama-index-embeddings-huggingface>=0.5",
    "llama-index-retrievers-bm25>=0.5",
    "torch>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "nicegui>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# NiceGUI's "simulated user" plugin: lets tests click through the real page code without a browser.
addopts = "-p nicegui.testing.user_plugin"
main_file = ""

# CPU-only PyTorch: the default Linux wheel bundles several GB of CUDA libraries
# that CPU inference never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
