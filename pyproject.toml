[project]
name = "autonoms"
version = "0.1.0"
description = "Autonomous GitHub issue resolution agent (learning project)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "llama-index-core>=0.12",
    "llama-index-embeddings-huggingface>=0.5",
    "llama-index-retrievers-bm25>=0.5",
    "torch>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonoms"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: the default Linux wheel bundles several GB of CUDA libraries
# that CPU inference never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
